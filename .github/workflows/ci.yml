name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insurcare
          POSTGRES_PASSWORD: insurcare
          POSTGRES_DB: insurcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U insurcare
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
        working-directory: backend
      - run: pip install pytest pytest-asyncio httpx
      - env:
          DATABASE_URL: postgresql://insurcare:insurcare@localhost:5432/insurcare
          JWT_SECRET: test-secret
          GEMINI_API_KEY: test-key
        run: pytest -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
        continue-on-error: true
      - run: npm run build
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
